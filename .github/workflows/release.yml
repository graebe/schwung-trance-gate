# Tag v0.1.0 -> build in Docker -> attach dist/trance-gate-module.tar.gz
# -> rewrite release.json on main, which is where the catalog reads it.
#
# Adapted from schwung-ducker's, which is the house pattern for a catalog
# module. The one addition is the explicit artifact check below.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' src/module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match module.json version ($MODULE_VERSION)"
            echo "Please update src/module.json to version $TAG_VERSION before tagging."
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          docker build -t module-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build module-builder ./scripts/build.sh

      # A build step that can be skipped silently defeats every bisect after
      # it. softprops warns on a missing file rather than failing, so a build
      # that produced nothing would publish an EMPTY release that the catalog
      # happily points at -- a 404 on install, reported as "the module is
      # broken" rather than as a release that was never built.
      - name: Verify the artifact exists and is aarch64
        run: |
          TARBALL=dist/trance-gate-module.tar.gz
          [ -f "$TARBALL" ] || { echo "ERROR: $TARBALL was not produced by build.sh"; exit 1; }
          tar -tzf "$TARBALL" | grep -q 'trance-gate/trance-gate.so' || {
            echo "ERROR: $TARBALL carries no trance-gate.so"; exit 1; }
          tar -xzf "$TARBALL" -C /tmp trance-gate/trance-gate.so
          file /tmp/trance-gate/trance-gate.so | grep -q 'ARM aarch64' || {
            echo "ERROR: trance-gate.so is not an aarch64 build:"
            file /tmp/trance-gate/trance-gate.so; exit 1; }
          echo "Artifact OK: $(ls -la "$TARBALL")"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/trance-gate-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > release.json << EOF
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/trance-gate-module.tar.gz"
          }
          EOF

          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
