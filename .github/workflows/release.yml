# Tag v0.1.0 -> build in Docker -> attach dist/trance-gate-module.tar.gz
# -> rewrite release.json on main, which is where the catalog reads it.
#
# Adapted from schwung-ducker's, which is the house pattern for a catalog
# module. The one addition is the explicit artifact check below.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' src/module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match module.json version ($MODULE_VERSION)"
            echo "Please update src/module.json to version $TAG_VERSION before tagging."
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          docker build -t module-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build module-builder ./scripts/build.sh

      # A build step that can be skipped silently defeats every bisect after
      # it. softprops warns on a missing file rather than failing, so a build
      # that produced nothing would publish an EMPTY release that the catalog
      # happily points at -- a 404 on install, reported as "the module is
      # broken" rather than as a release that was never built.
      - name: Verify the artifact exists and is aarch64
        run: |
          TARBALL=dist/trance-gate-module.tar.gz
          [ -f "$TARBALL" ] || { echo "ERROR: $TARBALL was not produced by build.sh"; exit 1; }
          tar -tzf "$TARBALL" | grep -q 'trance-gate/trance-gate.so' || {
            echo "ERROR: $TARBALL carries no trance-gate.so"; exit 1; }
          tar -xzf "$TARBALL" -C /tmp trance-gate/trance-gate.so
          file /tmp/trance-gate/trance-gate.so | grep -q 'ARM aarch64' || {
            echo "ERROR: trance-gate.so is not an aarch64 build:"
            file /tmp/trance-gate/trance-gate.so; exit 1; }
          echo "Artifact OK: $(ls -la "$TARBALL")"

      # `prerelease` is NOT inferred from the version. Without this a
      # `-beta.` tag is published as a normal release and GitHub shows it as
      # **Latest** -- so the build that needs an unreleased host becomes the
      # one every visitor is pointed at, which is the opposite of the point of
      # having channels at all.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/trance-gate-module.tar.gz
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A tag routes to a CHANNEL. `-beta.` goes to channels.beta and touches
      # nothing else; anything else is stable and must ALSO update the
      # top-level version/download_url, because a manager that predates
      # channels reads only those and would otherwise be pinned forever.
      - name: Commit release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/trance-gate-module.tar.gz"
          case "$VERSION" in
            *-beta.*) CHANNEL=beta ;;
            *)        CHANNEL=stable ;;
          esac
          echo "routing $VERSION to the $CHANNEL channel"

          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 - "$VERSION" "$URL" "$CHANNEL" <<'PY'
          import json, sys
          version, url, channel = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              rel = json.load(open("release.json"))
          except Exception:
              rel = {}
          ch = rel.setdefault("channels", {})
          ch[channel] = {"version": version, "download_url": url}
          if channel == "stable":
              # what a channels-unaware manager reads
              rel["version"] = version
              rel["download_url"] = url
          rel = {"version": rel.get("version", version),
                 "download_url": rel.get("download_url", url),
                 "channels": ch}
          json.dump(rel, open("release.json", "w"), indent=2)
          open("release.json", "a").write("\n")
          print("release.json now:", json.dumps(rel))
          PY

          git add release.json
          git commit -m "chore: ${CHANNEL} channel -> ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
